<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <title>LSSD Uprank Antrag</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: linear-gradient(#5a3e1b, #c2a878);
            color: #f5e9d3;
            text-align: center;
            padding-top: 80px;
        }

        h1 {
            font-size: 3rem;
            margin-bottom: 20px;
            color: #f7d9a6;
            text-shadow: 2px 2px 4px #000;
        }

        p {
            font-size: 1.4rem;
            margin-bottom: 40px;
        }

        /* GIF rechts neben dem JA-Button */
        .gif-box {
            width: 180px;
            height: 180px;
        }

        .gif-box img {
            width: 100%;
            height: 100%;
            object-fit: contain;
        }

        .btn-container {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 40px;
            margin-top: 20px;
        }

        button {
            padding: 15px 30px;
            font-size: 1.3rem;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            transition: 0.2s;
            font-weight: bold;
        }

        #yesBtn {
            background: #d4af37;
            color: black;
            box-shadow: 0 0 10px #000;
        }

        #yesBtn:hover {
            background: #f5d76e;
        }

        #noBtn {
            background: #8b2e2e;
            color: white;
            position: absolute;
            box-shadow: 0 0 10px #000;
        }

        /* Trennlinie */
        .section-divider {
            width: 80%;
            height: 3px;
            background: #d4af37;
            margin: 60px auto;
            border-radius: 2px;
            box-shadow: 0 0 10px #000;
        }

        /* Unterer Bereich – breiter & tiefer */
        .lower-section {
            padding: 60px 40px 80px 40px;
            background: rgba(0, 0, 0, 0.35);
            border-radius: 15px;
            width: 95%;
            margin-left: auto;
            margin-right: auto;
            box-shadow: inset 0 0 25px rgba(0,0,0,0.6), 0 0 15px #000;
            position: relative;
        }

        /* Polaroid Grid */
        .image-grid {
            display: flex;
            justify-content: space-between;
            padding: 0 20px;
        }

        .polaroid {
            background: white;
            padding: 10px 10px 25px 10px;
            border-radius: 8px;
            box-shadow: 0 6px 14px rgba(0,0,0,0.7);
            position: relative;
            margin-left: -5px;
            margin-right: -5px;
            top: 10px;
            z-index: 1;
            transition: transform 0.2s, z-index 0.2s;
        }

        .polaroid:hover {
            transform: scale(1.15);
            z-index: 10;
        }

        .polaroid img {
            width: auto;
            height: 200px;
            object-fit: contain;
        }

        .polaroid .caption {
            font-family: "Comic Sans MS", "Bradley Hand", cursive;
            font-size: 1rem;
            margin-top: 8px;
            color: #333;
        }

        /* individuelle Rotationen */
        .rotate1 { transform: rotate(-2deg); }
        .rotate2 { transform: rotate(1deg); }
        .rotate3 { transform: rotate(-1deg); }
        .rotate4 { transform: rotate(2deg); }

    </style>
</head>

<body>

    <h1>LSSD Uprank Entscheidung</h1>
    <p>Bitte wählen Sie aus, ob <strong>[First Recruit] Henry Grande</strong> einen Uprank erhalten soll.</p>

    <div class="btn-container">

        <!-- JA BUTTON -->
        <button id="yesBtn" onclick="alert('Danke! Uprank wurde bestätigt!')">Ja</button>

        <!-- GIF NEBEN DEM JA BUTTON -->
        <div class="gif-box">
            <img src="https://media.tenor.com/2tZLxE-tobgAAAAM/i-love-you-love.gif" alt="Meme">
        </div>

        <!-- NEIN BUTTON -->
        <button id="noBtn">Nein</button>
    </div>

    <script>
        const noBtn = document.getElementById("noBtn");

        noBtn.addEventListener("mouseover", () => {
            const x = Math.random() * (window.innerWidth - 150);
            const y = Math.random() * (window.innerHeight - 150);
            noBtn.style.left = x + "px";
            noBtn.style.top = y + "px";
        });
    </script>

    <!-- Trennlinie -->
    <div class="section-divider"></div>

    <!-- UNTERER BEREICH MIT POLAROID-BILDERN -->
    <div class="lower-section">

        <div class="image-grid">

            <div class="polaroid rotate1">
                <img src="https://s1.directupload.eu/images/260205/59qakbwh.png" alt="IC Bild 1">
                <div class="caption">FirstRecruit-Henry</div>
            </div>

            <div class="polaroid rotate2">
                <img src="https://s1.directupload.eu/images/260205/f7o8dvhl.png" alt="IC Bild 2">
                <div class="caption">FirstRecruit-Henry</div>
            </div>

            <div class="polaroid rotate3">
                <img src="https://s1.directupload.eu/images/260205/dzix9f6d.png" alt="IC Bild 3">
                <div class="caption">FirstRecruit-Henry</div>
            </div>

            <div class="polaroid rotate4">
                <img src="https://s1.directupload.eu/images/260205/5kmfldea.png" alt="IC Bild 4">
                <div class="caption">FirstRecruit-Henry</div>
            </div>

        </div>

    </div>

</body>
</html>
