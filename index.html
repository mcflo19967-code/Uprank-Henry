<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <title>LSSD Uprank Antrag</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: linear-gradient(#5a3e1b, #c2a878); /* Braun → Sand Verlauf */
            color: #f5e9d3;
            text-align: center;
            padding-top: 80px;
        }

        h1 {
            font-size: 3rem;
            margin-bottom: 20px;
            color: #f7d9a6;
            text-shadow: 2px 2px 4px #000;
        }

        p {
            font-size: 1.4rem;
            margin-bottom: 40px;
        }

        .btn-container {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 40px;
            margin-top: 40px;
        }

        button {
            padding: 15px 30px;
            font-size: 1.3rem;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            transition: 0.2s;
            font-weight: bold;
        }

        #yesBtn {
            background: #d4af37; /* Gold Sheriff Badge Style */
            color: black;
            box-shadow: 0 0 10px #000;
        }

        #yesBtn:hover {
            background: #f5d76e;
        }

        #noBtn {
            background: #8b2e2e;
            color: white;
            position: absolute;
            box-shadow: 0 0 10px #000;
        }

        .gif-box {
            width: 150px;
            height: 150px;
        }

        .gif-box img {
            width: 100%;
            height: 100%;
            object-fit: contain;
        }
    </style>
</head>
<body>

    <h1>LSSD Uprank Entscheidung</h1>
    <p>Bitte wählen Sie aus, ob <strong>[First Recruit] Henry Grande</strong> einen Uprank erhalten soll.</p>

    <div class="btn-container">
        <button id="yesBtn" onclick="alert('Danke! Uprank wurde bestätigt!')">Ja</button>

        <!-- GIF neben dem JA Button -->
        <div class="gif-box">
            <img src="https://media.tenor.com/QpIBfnIvRLcAAAAi/i-love-you-love.gif" alt="Meme">
        </div>

        <button id="noBtn">Nein</button>
    </div>

    <script>
        const noBtn = document.getElementById("noBtn");

        noBtn.addEventListener("mouseover", () => {
            const x = Math.random() * (window.innerWidth - 150);
            const y = Math.random() * (window.innerHeight - 150);
            noBtn.style.left = x + "px";
            noBtn.style.top = y + "px";
        });
    </script>

</body>
</html>
