<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <title>LSSD Uprank Antrag</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: linear-gradient(#5a3e1b, #c2a878);
            color: #f5e9d3;
            text-align: center;
            padding-top: 80px;
        }

        h1 {
            font-size: 3rem;
            margin-bottom: 20px;
            color: #f7d9a6;
            text-shadow: 2px 2px 4px #000;
        }

        p {
            font-size: 1.4rem;
            margin-bottom: 40px;
        }

        /* GIF rechts neben dem JA-Button */
        .gif-box {
            width: 180px;
            height: 180px;
        }

        .gif-box img {
            width: 100%;
            height: 100%;
            object-fit: contain;
        }

        .btn-container {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 40px;
            margin-top: 20px;
        }

        button {
            padding: 15px 30px;
            font-size: 1.3rem;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            transition: 0.2s;
            font-weight: bold;
        }

        #yesBtn {
            background: #d4af37;
            color: black;
            box-shadow: 0 0 10px #000;
        }

        #yesBtn:hover {
            background: #f5d76e;
        }

        #noBtn {
            background: #8b2e2e;
            color: white;
            position: absolute;
            box-shadow: 0 0 10px #000;
            z-index: 9999; /* Button läuft über die Polaroids */
        }

        /* Unterer Bereich */
        .lower-section {
            padding: 0;
            background: rgba(0, 0, 0, 0.35);
            border-radius: 15px;
            width: 95%;
            margin-left: auto;
            margin-right: auto;
            box-shadow: inset 0 0 25px rgba(0,0,0,0.6), 0 0 15px #000;
        }

        /* Polaroid-Container */
        .polaroid-row {
            display: flex;
            justify-content: center;
            gap: 0;
            padding: 20px 0;
        }

        .polaroid {
            background: white;
            padding: 10px 10px 25px 10px;
            border-radius: 8px;
            box-shadow: 0 6px 14px rgba(0,0,0,0.7);
            margin-left: -20px;
            margin-right: -20px;
            transform-origin: center;
            transition: transform 0.2s;
        }

        .polaroid:hover {
            transform: scale(1.1);
            z-index: 10;
        }

        .polaroid img {
            width: auto;
            height: auto;
            max-width: 230px;
            object-fit: contain;
        }

        .caption {
            font-family: "Comic Sans MS", "Bradley Hand", cursive;
            font-size: 1rem;
            margin-top: 8px;
            color: #333;
        }

        /* leichte Rotationen */
        .r1 { transform: rotate(-3deg); }
        .r2 { transform: rotate(2deg); }
        .r3 { transform: rotate(-1deg); }
        .r4 { transform: rotate(3deg); }

        /* Konfetti */
        .confetti {
            position: fixed;
            top: -20px;
            opacity: 0.9;
            animation: fall 3s linear forwards;
            z-index: 9998;
        }

        @keyframes fall {
            0% { transform: translateY(0) rotate(0deg); }
            100% { transform: translateY(120vh) rotate(720deg); }
        }

    </style>
</head>

<body>

    <h1>LSSD Uprank Entscheidung</h1>
    <p>Bitte wählen Sie aus, ob <strong>[First Recruit] Henry Grande</strong> einen Uprank erhalten soll.</p>

    <div class="btn-container">

        <!-- JA BUTTON -->
        <button id="yesBtn" onclick="startParty()">Ja</button>

        <!-- GIF NEBEN DEM JA BUTTON -->
        <div class="gif-box">
            <img src="https://media.tenor.com/QpIBfnIvRLcAAAAi/i-love-you-love.gif" alt="Meme">
        </div>

        <!-- NEIN BUTTON -->
        <button id="noBtn">Nein</button>
    </div>

    <script>
        const noBtn = document.getElementById("noBtn");

        noBtn.addEventListener("mouseover", () => {
            const x = Math.random() * (window.innerWidth - 150);
            const y = Math.random() * (window.innerHeight - 150);
            noBtn.style.left = x + "px";
            noBtn.style.top = y + "px";
        });

        function startParty() {
            launchConfetti();
            setTimeout(() => {
                alert('Danke! Uprank wurde bestätigt!');
            }, 1500);
        }

        function launchConfetti() {
            const colors = ["#ff0a54", "#ff477e", "#ff7096", "#ff85a1", "#fbb1bd", "#f9bec7", "#00bbf9", "#00f5d4"];

            for (let i = 0; i < 120; i++) {
                const confetti = document.createElement("div");
                confetti.classList.add("confetti");

                confetti.style.backgroundColor = colors[Math.floor(Math.random() * colors.length)];
                confetti.style.left = Math.random() * window.innerWidth + "px";

                const size = Math.random() * 8 + 6;
                confetti.style.width = size + "px";
                confetti.style.height = size * 0.4 + "px";

                confetti.style.transform = `rotate(${Math.random() * 360}deg)`;

                document.body.appendChild(confetti);

                setTimeout(() => {
                    confetti.remove();
                }, 3000);
            }
        }
    </script>

    <!-- POLAROID-BEREICH -->
    <div class="lower-section">

        <div class="polaroid-row">

            <div class="polaroid r1">
                <img src="https://s1.directupload.eu/images/260205/59qakbwh.png">
                <div class="caption">FirstRecruit H.Grande</div>
            </div>

            <div class="polaroid r2">
                <img src="https://s1.directupload.eu/images/260205/f7o8dvhl.png">
                <div class="caption">FirstRecruit H.Grande</div>
            </div>

            <div class="polaroid r3">
                <img src="https://s1.directupload.eu/images/260205/dzix9f6d.png">
                <div class="caption">FirstRecruit H.Grande</div>
            </div>

            <div class="polaroid r4">
                <img src="https://s1.directupload.eu/images/260205/5kmfldea.png">
                <div class="caption">FirstRecruit H.Grande</div>
            </div>

        </div>

    </div>

</body>
</html>
